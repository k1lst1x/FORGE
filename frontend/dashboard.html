<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE — dashboard</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // The landing page's palette, bound to the token names the console already
  // uses. Retheming the whole console is therefore a config change, not a
  // rewrite of 1,600 lines of render code.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg:      '#000000',
          surface: '#0C0C0F',
          raise:   '#16161A',
          line:    '#1E1E23',
          ink:     '#FFFFFF',
          dim:     '#8B8B93',
          mute:    '#5C5C64',
          ok:      '#34D399',
          warn:    '#F59E0B',
          bad:     '#EF4444',
          info:    '#60A5FA',
          viol:    '#8B7CF6',
          brand:   '#FB923C',
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'],
          mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  html, body { background: #000; }
  body { -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(251,146,60,.28); }

  .lbl {
    font-size: 11px; line-height: 1.2; text-transform: uppercase;
    letter-spacing: .14em; color: #5C5C64;
  }

  /* ---- design elements carried over from the landing page ---------------- */
  .silver {
    background: linear-gradient(178deg, #E7E7EA 4%, #9A9AA2 46%, #4E4E56 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card-edge {
    background: linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0) 42%), #0A0A0C;
    border: 1px solid rgba(255,255,255,.075);
  }
  .tickrow { position: relative; }
  .tickrow::before, .tickrow::after {
    content: '+'; position: absolute; top: -10px; font-size: 14px; line-height: 1;
    color: rgba(255,255,255,.28); font-weight: 300; pointer-events: none;
  }
  .tickrow::before { left: -7px; } .tickrow::after { right: -7px; }
  .hatch {
    background-image: repeating-linear-gradient(45deg,
      rgba(255,255,255,.06) 0 1px, transparent 1px 9px);
  }
  .pill-dark {
    background: #0A0A0C; border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.13);
  }
  .pill-dark:hover { border-color: rgba(255,255,255,.4); background: #121215; }

  /* ---- motion: only the two things that mean something ------------------- */
  @keyframes forge-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(96,165,250,.55); }
    50%      { box-shadow: 0 0 0 7px rgba(96,165,250,0); }
  }
  .stage-active { animation: forge-ring 1.8s cubic-bezier(.4,0,.6,1) infinite; }
  @keyframes forge-dot { 0%,100% { opacity: 1; } 50% { opacity: .32; } }
  .dot-live { animation: forge-dot 1.8s ease-in-out infinite; }
  @keyframes forge-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk {
    background-image: linear-gradient(90deg, #0C0C0F 0%, #1B1B21 50%, #0C0C0F 100%);
    background-size: 200% 100%; animation: forge-shimmer 1.5s linear infinite; border-radius: 3px;
  }
  @media (prefers-reduced-motion: reduce) { .stage-active, .dot-live, .sk { animation: none; } }

  * { scrollbar-width: thin; scrollbar-color: #1E1E23 transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #1E1E23; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #2C2C33; }

  .spring { transition: height .4s cubic-bezier(.175,.885,.32,1.275), border-color .2s ease; }
  .spring-fast { transition: height .15s ease-out, border-color .2s ease; }
  .morph { transition: opacity .3s cubic-bezier(.175,.885,.32,1.275), transform .3s cubic-bezier(.175,.885,.32,1.275); }
  .bar-lvl { transition: opacity .3s ease; }
  textarea::placeholder { color: #5C5C64; }
  a, button { outline-color: #60A5FA; }
  [hidden] { display: none !important; }
</style>
</head>

<body class="h-full bg-bg text-ink font-sans text-[16px]">

<!-- ═════════════════════════════════════════════════════════ auth gate -->
<div id="auth-screen" hidden class="fixed inset-0 z-50 bg-bg flex items-center justify-center p-8"></div>

<!-- ═══════════════════════════════════════════════════════════ dashboard -->
<div id="app" hidden class="min-h-full">

  <!-- top bar ─────────────────────────────────────────────────────────── -->
  <header class="fixed inset-x-0 top-0 z-40 h-16 border-b border-white/[0.07] bg-black/85 backdrop-blur-xl">
    <div class="flex h-16 items-center gap-5 px-6">

      <a href="index.html" class="flex items-center gap-2.5 shrink-0" title="Back to the landing page">
        <svg width="19" height="19" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M2.5 19.5V2.5h17L11.5 10.5H7v2.6h6.2L11 19.5H2.5z" fill="#fff"/>
        </svg>
        <span class="text-[15px] font-semibold tracking-[0.20em]">FORGE</span>
      </a>

      <span class="h-5 w-px bg-white/12"></span>
      <h1 id="page-title" class="text-[15px] font-medium text-dim">Live</h1>

      <div class="ml-auto flex items-center gap-3">
        <nav class="hidden items-center gap-4 lg:flex" aria-label="Workspace flow">
          <a href="index.html" class="text-[12px] text-dim hover:text-ink">Landing</a>
          <a href="dashboard.html#live" class="text-[12px] text-dim hover:text-ink">Dashboard</a>
          <a href="app.html" class="text-[12px] text-dim hover:text-ink">Operator app</a>
        </nav>
        <!-- next audit -->
        <div class="hidden items-center gap-2 rounded-full border border-white/[0.09] bg-white/[0.03] px-3.5 py-1.5 md:flex">
          <span class="lbl text-[10px]">Next audit</span>
          <span class="font-mono text-[13px] text-ink tabular-nums" data-tick="countdown">--:--</span>
        </div>
        <!-- scheduler health -->
        <div class="flex items-center gap-2 rounded-full border border-white/[0.09] bg-white/[0.03] px-3.5 py-1.5">
          <span class="inline-block h-1.5 w-1.5 rounded-full bg-mute" data-health-dot></span>
          <span class="text-[13px] text-dim" data-health-text>connecting</span>
        </div>
        <button data-act="refresh" title="Refresh (R)"
          class="flex h-9 w-9 items-center justify-center rounded-full border border-white/[0.09] text-dim hover:border-white/30 hover:text-ink">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="user-menu" class="relative"></div>
      </div>
    </div>
  </header>

  <!-- sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="fixed bottom-0 left-0 top-16 z-30 w-[248px] border-r border-white/[0.07] bg-[#050506] flex flex-col">
    <div class="px-4 pt-6">
      <div class="lbl mb-2 px-3">Factory</div>
      <nav id="nav" class="space-y-1" aria-label="Dashboard sections"></nav>
    </div>

    <div class="mt-auto p-4">
      <div class="card-edge rounded-xl p-4">
        <div class="lbl mb-2">Open findings</div>
        <div id="side-sev" class="flex items-end gap-4"></div>
      </div>
      <div class="mt-3 space-y-2">
        <a href="index.html" class="flex items-center gap-2 px-3 py-2 text-[14px] text-mute hover:text-ink">
          ← Landing
        </a>
        <a href="app.html" class="flex items-center gap-2 px-3 py-2 text-[14px] text-mute hover:text-ink">
          → Operator app
        </a>
      </div>
    </div>
  </aside>

  <div class="fixed left-[248px] right-0 top-16 z-20 border-b border-white/[0.07] bg-black/70 backdrop-blur-xl">
    <div class="flex items-center gap-2 px-6 py-3 text-[11px] font-semibold tracking-[0.14em] text-dim uppercase">
      <a href="index.html" class="hover:text-ink">Home</a>
      <span>›</span>
      <a href="dashboard.html#live" class="hover:text-ink">Dashboard</a>
      <span>›</span>
      <a href="app.html" class="hover:text-ink">Operator app</a>
    </div>
  </div>

  <!-- main ────────────────────────────────────────────────────────────── -->
  <main class="ml-[248px] pt-16">
    <div class="mx-auto max-w-[1400px] px-8 py-8">
      <div id="statusbar" class="tickrow"></div>
      <div id="screen" class="mt-8"></div>
    </div>
  </main>
</div>

<!--
  Vite substitutes %VITE_*% in HTML entry files, which is the only way an env
  var can reach public/ -- files there are served verbatim and never processed.
  Unset vars stay as the literal "%VITE_...%", so config.js ignores any value
  still starting with "%". Opening this file straight from disk is therefore
  harmless: it just falls back to the literals in config.js.
-->
<script>
  window.FORGE_ENV = {
    supabaseUrl: "%VITE_SUPABASE_URL%",
    supabaseAnonKey: "%VITE_SUPABASE_ANON_KEY%",
    apiBase: "%VITE_FORGE_CONTROL_URL%",
  };
</script>
<script src="./console/config.js"></script>
<script src="./console/demo-data.js"></script>
<script src="./console/chat-input.js"></script>
<script src="./console/auth.js"></script>
<script src="./console/app.js"></script>
</body>
</html>
