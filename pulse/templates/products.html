{% extends "base.html" %}
{% block content %}
<p>{{ rows|length }} products, most expensive first. Scraped {{ freshness.age_seconds }}s ago.</p>
<table style="border-collapse:collapse;width:100%">
<tr><th align="left">Product</th><th align="left">Price</th><th align="left">Availability</th></tr>
{% for row in rows %}
<tr style="border-top:1px solid #334155">
  <td>{{ row.name }}</td>
  <td>{{ row.currency }} {{ row.price }}</td>
  <td>{{ row.availability }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
