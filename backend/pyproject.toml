[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-backend"
version = "0.1.0"
description = "FastAPI backend for the FORGE agentic software factory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.0,<9.0",
    "pytest-playwright>=0.7,<1.0",
    "playwright>=1.54,<2.0",
    "ruff>=0.12,<0.13",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
