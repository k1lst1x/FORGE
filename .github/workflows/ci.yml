name: FORGE Pulse CI & UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Start FastAPI App in background
        env:
          PYTHONPATH: backend
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8100 &
          timeout 10s bash -c 'until curl -s http://127.0.0.1:8100/docs > /dev/null; do sleep 1; done'

      - name: Run Pytest & Playwright Tests
        env:
          PYTHONPATH: backend:.
        run: |
          pytest